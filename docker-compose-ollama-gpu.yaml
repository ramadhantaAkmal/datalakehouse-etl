services:
  app:
    build: .
    ports:
      - 8000:8000
      - 5678:5678
    volumes:
      - .:/code
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    depends_on:
      - ollama
      - ollama-webui
    networks:
      - ollama-docker
      - superset-net
      
  ollama:
    volumes:
      - ./ollama/ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: docker.io/ollama/ollama:latest
    ports:
      - 7869:11434
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - ollama-docker
      - superset-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all 
              capabilities: [gpu]
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ollama-docker
      - superset-net
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/bash
    command: >
      -c "
      echo '🤖 Ollama server is ready!' &&
      echo '📥 Checking if mistral model is already installed...' &&
      if OLLAMA_HOST=http://ollama:11434 ollama list | grep -q ministral-3; then
        echo '✅ Mistral model already installed'
      else
        echo '📥 Pulling mistral model (this may take a few minutes)...' &&
        OLLAMA_HOST=http://ollama:11434 ollama pull ministral-3 &&
        echo '✅ Mistral model installed successfully!'
      fi &&
      echo '🎉 Ollama initialization complete!' &&
      sleep infinity
      "
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://ollama:11434 ollama list | grep -q mistral || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-webui
    volumes:
      - ./ollama/ollama-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - 8080:8080
    environment: # https://docs.openwebui.com/getting-started/env-configuration#default_models
      - OLLAMA_BASE_URLS=http://host.docker.internal:7869 #comma separated ollama hosts
      - ENV=dev
      - WEBUI_AUTH=False
      - WEBUI_NAME=valiantlynx AI
      - WEBUI_URL=http://localhost:8080
      - WEBUI_SECRET_KEY=t0p-s3cr3t
      - NO_PROXY=host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - ollama-docker
      - superset-net

networks:
  ollama-docker:
    external: false
  superset-net:
    external: true
volumes:
  ollama_models:
      driver: local
      name: ollama_models
